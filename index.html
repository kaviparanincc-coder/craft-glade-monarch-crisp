<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#0d9488" />
  <meta name="description" content="My Assistant — offline personal task manager" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="My Assistant" />
  <title>My Assistant</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icons/icon-192.svg" />
  <link rel="apple-touch-icon" href="icons/icon-192.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1 id="header-title">Today</h1>
      <div class="header-actions">
        <!-- reserved for future quick actions -->
      </div>
    </header>

    <main>
      <section id="view-today" class="view active" aria-label="Today"></section>
      <section id="view-calendar" class="view" aria-label="Calendar"></section>
      <section id="view-all" class="view" aria-label="All Tasks"></section>
      <section id="view-more" class="view" aria-label="More"></section>
    </main>

    <button class="fab" id="fab" aria-label="Add task">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>

    <nav class="bottom-nav" aria-label="Main">
      <button class="nav-item active" data-view="today" aria-label="Today">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Today
      </button>
      <button class="nav-item" data-view="calendar" aria-label="Calendar">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Calendar
      </button>
      <button class="nav-item" data-view="all" aria-label="All Tasks">
        <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        All
      </button>
      <button class="nav-item" data-view="more" aria-label="More">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>
        More
      </button>
    </nav>
  </div>

  <div class="overlay" id="overlay" role="dialog" aria-modal="true">
    <div class="sheet" id="sheet"></div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="app.js"></script>
</body>
</html>
